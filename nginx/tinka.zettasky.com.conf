# /etc/nginx/sites-available/tinka.zettasky.com
# Copiar a: /etc/nginx/sites-available/tinka.zettasky.com
# Activar con: ln -s /etc/nginx/sites-available/tinka.zettasky.com /etc/nginx/sites-enabled/
# SSL con: certbot --nginx -d tinka.zettasky.com

# ── Redirigir HTTP → HTTPS ─────────────────────────────
server {
    listen 80;
    server_name tinka.zettasky.com;

    # Certbot coloca aquí el challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ────────────────────────────────────
server {
    listen 443 ssl;
    server_name tinka.zettasky.com;

    # Certificados SSL (generados por certbot)
    ssl_certificate     /etc/letsencrypt/live/tinka.zettasky.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tinka.zettasky.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de seguridad
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── Frontend (contenedor tinka_frontend en puerto 80) ──
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend API (contenedor tinka_backend en puerto 3000) ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # CORS (por si el navegador hace peticiones directas)
        add_header Access-Control-Allow-Origin  "https://tinka.zettasky.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Content-Type"                always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
